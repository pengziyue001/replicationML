# Gu, Kelly, Xiu (2020) replication settings.
# Main sample matches the paper: March 1957–December 2016.
# 2017–2020 extension is intentionally not run in this pass.

sample:
  start_yyyymm: 195703
  end_yyyymm: 201612
  train_start_year: 1957
  first_test_year: 1987
  last_test_year: 2016
  val_years: 12

# Eight Welch–Goyal predictors, z-scored with training-window moments
# before they interact with firm characteristics. The constant is not scaled.
macro:
  names: [dp, ep, bm, ntis, tbl, tms, dfy, svar]
  standardize: true

ols3:
  features: [mvel1, bm, mom12m]

enet:
  # Paper: rho = 0 is lasso and rho = 1 is ridge. rho = 0.5 is fixed.
  # Smooth term is (1 / (2N)) * SSE so the gradient is (1/N) Z'(Zθ − y),
  # matching the usual proximal-gradient / sklearn scaling. lambda is chosen
  # on the validation window; the grid widens automatically if the best value
  # sits on the boundary.
  rho: 0.5
  lambdas: [1.0e-8, 1.0e-7, 1.0e-6, 1.0e-5, 1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2, 3.0e-2, 1.0e-1, 1.0]
  max_iter: 2000
  tol: 1.0e-7

pcr:
  ks: [1, 2, 3, 5, 7, 10, 15, 20, 25, 30, 40, 50, 60, 80, 100]

pls:
  ks: [1, 2, 3, 4, 5, 6, 7, 8, 10, 12, 15, 20]

# Spline GLM with group lasso. Three knots, as in Internet Appendix Table A.5.
# The constant in the paper's basis is a single unpenalized intercept, not one
# copy inside every group (those copies are identical and make the Gram singular).
glm:
  n_knots: 3
  quantiles: [0.25, 0.5, 0.75]
  knot_sample: 120000
  lambdas: [1.0e-6, 1.0e-5, 1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2, 3.0e-2, 1.0e-1]
  max_iter: 1500
  tol: 1.0e-6
  huber_rounds: 4

huber:
  # xi is the 99.9% quantile of |excess return| in the training sample.
  quantile: 0.999
  max_iter: 20
  tol: 1.0e-8
